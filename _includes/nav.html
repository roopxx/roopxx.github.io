<header class="site-head">
  <a
    class="brand"
    href="{{ '/' | relative_url }}"
    aria-label="{{ site.name | default: site.title }} — home"
  >
    <span class="logotype"
      >r{% include logo.html class="logo-eyes" %}pxx<span
        class="logo-dot"
      ></span
    ></span>
  </a>
  <nav aria-label="Primary">
    {%- for item in site.data.nav %}
      {%- assign is_active = false %}
      {%- if item.url != '/' and page.url contains item.url -%}
        {%- assign is_active = true -%}
      {%- endif %}
      <a
        href="{{ item.url | relative_url }}"
        {% if is_active %}
          aria-current="page"
        {% endif %}
      >
        {{- item.title -}}
      </a>
    {%- endfor %}
  </nav>
  <button
    id="theme-toggle"
    type="button"
    aria-pressed="false"
    aria-label="Switch to dark theme"
  >
    <svg
      class="icon icon-sun"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg
      class="icon icon-moon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
    </svg>
  </button>
</header>
