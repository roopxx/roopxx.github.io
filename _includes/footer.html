<footer class="site-foot">
  <a href="mailto:{{ site.email }}">Email</a>
  <a href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub</a>
  <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>
  <a href="{{ '/resume/' | relative_url }}">Resume</a>
  <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  {%- if site.build.short_sha and site.build.short_sha != '' %}
    <span class="meta build">
      last deploy
      <a
        href="https://github.com/{{ site.repository }}/commit/{{ site.build.sha }}"
        target="_blank"
        rel="noopener"
      >
        {{- site.build.short_sha -}}
      </a>
      · chennai
      <time datetime="{{ site.build.datetime }}">{{ site.build.time }}</time>
    </span>
  {%- endif %}
</footer>
