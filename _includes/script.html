<script>
  (function () {
    var themes = window.__themes;
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');

    function pair() {
      var month = new Date().getMonth() + 1;
      return (
        themes.months.filter(function (m) {
          return m.month === month;
        })[0] || themes.months[0]
      );
    }

    var eyes = document.querySelector('.logo-eyes');
    var paletteName = document.querySelector('.palette-name');
    var monthNames = 'jan feb mar apr may jun jul aug sep oct nov dec'.split(
      ' ',
    );

    function set(theme) {
      var isDark = theme === pair().dark;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-mode', isDark ? 'dark' : 'light');
      root.setAttribute('data-month', String(pair().month));
      if (paletteName) {
        paletteName.textContent = monthNames[pair().month - 1] + ' · ' + theme;
      }
      if (!toggle) return;
      toggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
      toggle.setAttribute(
        'aria-label',
        isDark ? 'Switch to light theme' : 'Switch to dark theme',
      );
    }

    function toggleTheme() {
      var p = pair();
      var next = root.getAttribute('data-theme') === p.dark ? p.light : p.dark;
      try {
        localStorage.setItem('theme:' + p.month, next);
      } catch (e) {}
      set(next);
      if (eyes) {
        eyes.classList.remove('blink');
        void eyes.getBoundingClientRect();
        eyes.classList.add('blink');
      }
    }

    if (eyes) {
      eyes.addEventListener('animationend', function () {
        eyes.classList.remove('blink');
      });
    }

    if (toggle) toggle.addEventListener('click', toggleTheme);
    set(root.getAttribute('data-theme') || pair().light);

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var el = document.activeElement;
      if (
        el &&
        (el.tagName === 'INPUT' ||
          el.tagName === 'TEXTAREA' ||
          el.isContentEditable)
      )
        return;
      if (e.key === 'd' || e.key === 'D') toggleTheme();
    });
  })();
</script>
<script>
  /* Copy-a-link anchors on headings inside articles. */
  document.addEventListener('DOMContentLoaded', function () {
    document
      .querySelectorAll('article h2[id], article h3[id], article h4[id]')
      .forEach(function (heading) {
        var a = document.createElement('a');
        a.className = 'anchor';
        a.href = '#' + heading.id;
        a.setAttribute('aria-hidden', 'true');
        a.textContent = '#';
        heading.appendChild(a);
      });
  });
</script>
<script>
  /* 404: the pupil follows the pointer. Its reach is in SVG units, so it
     stays inside the ring at any size. After a pause the idle animation
     takes over again. */
  (function () {
    var lost = document.querySelector('.lost');
    var ring = document.querySelector('.lost-ring');
    var pupil = document.querySelector('.lost-pupil');
    if (!lost || !ring || !pupil) return;
    var reach = 145;
    var timer;

    document.addEventListener('pointermove', function (e) {
      var box = ring.getBoundingClientRect();
      var dx = e.clientX - (box.left + box.width / 2);
      var dy = e.clientY - (box.top + box.height / 2);
      var dist = Math.hypot(dx, dy) || 1;
      var k = Math.min(1, dist / (box.width * 1.5)) * reach;
      pupil.style.transform =
        'translate(' + (dx / dist) * k + 'px, ' + (dy / dist) * k + 'px)';
      lost.classList.add('live');
      clearTimeout(timer);
      timer = setTimeout(function () {
        lost.classList.remove('live');
      }, 2500);
    });
  })();
</script>
