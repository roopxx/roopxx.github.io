<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>
    {%- if page.title and page.title != '' -%}
      {{- page.title }} — {{ site.title -}}
    {%- else -%}
      {{- site.title -}}
    {%- endif -%}
  </title>
  <meta
    name="description"
    content="{{ page.description | default: site.metadescription | strip_html | normalize_whitespace | escape }}"
  />
  {% if page.unlisted -%}
    <meta name="robots" content="noindex" />
  {%- endif %}

  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link
    rel="alternate"
    type="application/atom+xml"
    title="{{ site.title }}"
    href="{{ '/feed.xml' | relative_url }}"
  />

  {% if page.date -%}
    <meta
      property="article:published_time"
      content="{{ page.date | date_to_xmlschema }}"
    />
  {%- endif %}
  {% for tag in page.tags -%}
    <meta property="article:tag" content="{{ tag }}" />
  {%- endfor %}

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@{{ site.twitter }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta
    property="og:description"
    content="{{ page.description | default: site.metadescription | strip_html | normalize_whitespace | escape }}"
  />
  <meta
    property="og:type"
    content="{% if page.date %}article{% else %}website{% endif %}"
  />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta
    property="og:image"
    content="{{ page.image | default: site.image | absolute_url }}"
  />

  <link
    rel="icon"
    type="image/svg+xml"
    href="{{ '/assets/favicon/favicon.svg' | relative_url }}"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}"
  />
  <link
    rel="shortcut icon"
    href="{{ '/assets/favicon/favicon.ico' | relative_url }}"
  />
  <link
    rel="manifest"
    href="{{ '/assets/favicon/site.webmanifest' | relative_url }}"
  />

  {% include theme-vars.html %}
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  {% unless page.unlisted -%}
    <script
      data-goatcounter="https://roopxx.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  {%- endunless %}
</head>
