name: Rupesh P S
title: Rupesh P S
tagline: Full-stack software developer
metadescription: >-
  Rupesh P S is a full-stack software developer in Chennai, India. Notes,
  weekly logs, and write-ups from building software.

email: rupesh.roopxx@gmail.com
twitter: roopxx
twitter_url: https://x.com/roopxx
github: roopxx
github_url: https://github.com/roopxx
linkedin: roopxx
linkedin_url: https://www.linkedin.com/in/roopxx/

domain: roopxx.github.io
url: https://roopxx.github.io
baseurl: ""
repository: roopxx/roopxx.github.io
image: /assets/cover.png
favicon: /assets/favicon/favicon.ico
feed_url: /feed.xml

permalink: pretty

include: ["_pages"]

# Collections (posts, weekly, work, reading, now) live together under content/.
collections_dir: content

# What is not part of the published site. Jekyll already ignores dotfiles,
# node_modules, Gemfile and Gemfile.lock; these are the rest.
exclude:
  - README.md
  - docs
  - tools
  - package.json
  - package-lock.json
  - vendor

plugins:
  - jekyll-redirect-from
  - jekyll-feed

sass:
  sass_dir: _sass
  style: :compressed

collections:
  posts:
    output: true
    permalink: /notes/:slug/
  weekly:
    output: true
    permalink: /weekly/:year/:month/:day/
  work:
    output: true
    permalink: /work/:slug/
  reading:
    output: true
    permalink: /reading/:slug/
  now:
    output: true
    permalink: /now/:year/:month/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: "content/_posts/**/*.md"
    values:
      layout: post
  - scope:
      path: "content/_weekly/**/*.md"
    values:
      layout: weekly
  - scope:
      path: "content/_work/**/*.md"
    values:
      layout: work
  - scope:
      path: "content/_reading/**/*.md"
    values:
      layout: reading
  - scope:
      path: "content/_now/**/*.md"
    values:
      layout: now

tag_page_layout: tag
tag_page_dir: tag
