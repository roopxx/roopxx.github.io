---
layout: default
---
<article>
  <h1>{{ page.date | date: '%B %Y' }}</h1>
  <p class="meta"
    ><time datetime="{{ page.date | date_to_xmlschema }}">
      {{- page.date | date: '%b %-d, %Y' -}}
    </time></p
  >
  {{ content }}
  <hr />
  <p class="meta"><a href="{{ '/now/' | relative_url }}">← Latest Now</a></p>
</article>
