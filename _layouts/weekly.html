---
layout: default
---
{% include rail.html %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{- page.date | date: '%b %-d, %Y' -}}
      </time>
    </p>
  {% endif %}
  {{ content }}
  {% include article-foot.html url='/weekly/' label='Weekly' near=true %}
</article>
