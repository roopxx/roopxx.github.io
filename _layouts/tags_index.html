---
layout: default
title: Tags
---
<h1>Tags</h1>
<p class="meta">{{ page.tags | size }} tags</p>
<p class="tags">
  {%- for tag in page.tags -%}
    <a href="{{ tag | slugify | prepend: '/tag/' | append: '/' | relative_url }}">
      {{- tag -}}
    </a>
    {%- unless forloop.last %} {% endunless -%}
  {%- endfor -%}
</p>
