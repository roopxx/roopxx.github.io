---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    {%- if page.date -%}
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{- page.date | date: '%b %-d, %Y' -}}
      </time>
    {%- endif -%}
    {%- if page.tags and page.tags.size > 0 %}
      ·
      {% for tag in page.tags -%}
        <a href="{{ tag | slugify | prepend: '/tag/' | append: '/' | relative_url }}">
          {{- tag -}}
        </a>
        {%- unless forloop.last %}, {% endunless -%}
      {%- endfor -%}
    {%- endif -%}
  </p>
  {{ content }}
  <hr />
  <p class="meta"><a href="{{ '/notes/' | relative_url }}">← Notes</a></p>
</article>
